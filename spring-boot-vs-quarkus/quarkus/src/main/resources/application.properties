quarkus.application.name=notes
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/notes}
quarkus.datasource.username=${DB_USER:notes}
quarkus.datasource.password=${DB_PASSWORD:notes}
quarkus.datasource.jdbc.max-size=20
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.http.port=8080
quarkus.management.enabled=true
quarkus.management.port=9091
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.devservices.enabled=false
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
